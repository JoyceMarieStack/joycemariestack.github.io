- title: Architecture Standards Corpus Audit
  description: >
    I structured 103 approved architecture standards into an agent-consumable
    corpus by applying a five-facet content model to classify each document,
    decomposing the corpus into 167 discrete knowledge objects with explicit
    chunk boundaries, and distilling each standard to its MUST/MUST NOT/SHOULD/MAY
    imperatives with cross-reference paths for dependency traversal. A permission
    boundary audit found that roughly 35% of linked normative content is
    auth-gated and unreachable to agents in a default configuration — a RAG
    corpus completeness problem that no amount of restructuring fixes without
    first surfacing the blind spot. The output also includes a Knowledge
    Acquisition Cost model that scores the ten most convoluted compliance
    journeys by documents consulted, repositories visited, permission
    boundaries crossed, terminology shifts, and inference gaps — mapping
    precisely to the failure modes where agents hallucinate or stall.
  finding: >
    A permission boundary audit found that roughly 35% of linked normative
    content is auth-gated and unreachable to agents in a default configuration.
  link: "#"

- title: ADR Pipeline
  description: >
    I built an end-to-end knowledge pipeline that scraped 2,677 Architecture
    Decision Records from 174 repositories across four GitHub organisations,
    ran automated term extraction to build a controlled vocabulary with
    synonym mappings, and applied semantic clustering to surface the
    architectural themes an organisation has actually been making decisions
    about. The key finding: 62% of ADRs rely on terms like data, service, and
    api — words with no discriminating signal — meaning the corpus cannot be
    reliably retrieved, filtered, or governed without first normalising the
    vocabulary. The pipeline produces a completeness score per ADR, an
    interactive discovery dashboard, and a standards compliance audit —
    turning scattered, ungoverned decision records into a reusable knowledge
    asset an agent can traverse.
  finding: >
    62% of ADRs rely on terms like data, service, and api — words with no
    discriminating signal — meaning the corpus cannot be reliably retrieved,
    filtered, or governed without first normalising the vocabulary.
  link: "#"

- title: TermDrift
  description: >
    This year I built a vocabulary pipeline to audit synonym fragmentation in
    enterprise compliance specs — surfacing four competing terms for the same
    audit concept across eight repositories, none defined in any approved
    standard — and proved that this fragmentation creates compliance gaps
    invisible to both human and LLM-assisted review. A parallel experiment
    demonstrated that a MUST-level immutability constraint does not propagate
    to the database enforcement surface without an explicit declaration: a
    single absent SQL statement that three AI critics missed. Both findings
    point to the same problem: agent-assisted development scales the
    ambiguities in the vocabulary and enforcement structure it is given.
  finding: >
    A MUST-level immutability constraint did not propagate to the database
    enforcement surface without an explicit declaration — a single absent
    SQL statement that three AI critics missed.
  link: "#"

- title: Agent Ready Docs
  description: >
    A CLI I built to score repositories on how well their documentation is
    structured for AI agents — checking everything from file completeness to
    token cost per document. I shipped it before I had empirical evidence
    that documentation quality actually affects agent outcomes. A
    22-experiment test harness later, the honest finding was that Markdown
    structure barely moved the needle; what mattered was whether the content
    existed at all, and whether filenames used vocabulary an agent could
    navigate by. The project taught me to build the outcome test before the
    metric you'll ask people to optimise for.
  finding: >
    Markdown structure barely moved the needle; what mattered was whether
    the content existed at all, and whether filenames used vocabulary an
    agent could navigate by.
  link: "#"

- title: AI Agent Reading Experiments
  description: >
    The empirical research that Agent Ready Docs should have been built on.
    A Python test harness gave an agent a controlled corpus of 45 documents
    and ran 22 hypothesis-driven experiments — each one isolating a single
    variable, run 3–5 times across read-only and shell-enabled tool
    conditions. The finding that changed how I think about AI documentation:
    a missing file produces an honest failure; a missing section produces
    confident fabrication. Markdown linting rules — heading spacing, code
    fence labels, table pipe style — had no measurable effect on accuracy in
    any condition tested.
  finding: >
    A missing file produces an honest failure; a missing section produces
    confident fabrication.
  link: "#"

- title: Doc Cost
  description: >
    Answers a question most teams don't think to ask: what does it cost an
    AI provider to read your documentation? It scans every Markdown file in
    a repository, counts tokens using the same encoder as GPT-4o and
    o-series models, and reports the financial cost per read per provider.
    The insight is that documentation isn't free at inference time — a large
    AGENTS.md file loaded into every session accumulates real spend across a
    team.
  finding: >
    Documentation isn't free at inference time — a large AGENTS.md file
    loaded into every session accumulates real spend across a team.
  link: "#"
